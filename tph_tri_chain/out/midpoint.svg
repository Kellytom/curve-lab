<text x="584.00" y="129.00" font-size="13" text-anchor="end" fill="#2e2413">v = 2t</text>
<text x="518.00" y="317.00" font-size="12" text-anchor="start" fill="#1f5fa8">rectangle 1</text>
<text x="550.00" y="280.00" font-size="12" text-anchor="start" fill="#2e2413">triangle 1</text>
<text x="492.00" y="120.00" font-size="12" text-anchor="start" fill="#7b6c4e">equal &mdash; no error</text>
