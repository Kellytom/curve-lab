<text x="60" y="86" font-size="15" font-weight="600" fill="#2e2413">A. one step, sampled at its middle</text>
<text x="60" y="105" font-size="12" fill="#7b6c4e">the step is not the curve&rsquo;s chord: 1/12 apart at the end</text>
