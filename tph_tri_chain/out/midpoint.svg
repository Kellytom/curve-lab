<text x="480" y="416" font-size="15" font-weight="600" fill="#2e2413">D. the ends</text>
<text x="480" y="435" font-size="12" fill="#7b6c4e">three steps of 1/12 make the gap at the far tip</text>
<text x="60" y="770" font-size="13" fill="#2e2413">At t = 0 the first step is centred on t = 1/2, so the chain leaves the nose on the tangent there, not on the tangent at 0.</text>
<text x="60" y="788" font-size="13" fill="#2e2413">At t = 3 the last step is centred on t = 5/2, and the 1/4 has accumulated, one 1/12 per step, all in the same direction.</text>
