<text x="470" y="258" font-family="ui-monospace,Menlo,monospace" font-size="12.5" fill="#3b2d1c">52</text>
<text x="46" y="312" font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="#3b2d1c">each factor of 5 buys one more step and eight more stations.</text>
