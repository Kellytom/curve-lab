<text x="340" y="140" font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="#8c6a21">(7,24,25) steps</text>
<text x="470" y="140" font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="#8c6a21">stations</text>
<text x="46" y="168" font-family="ui-monospace,Menlo,monospace" font-size="12.5" fill="#3b2d1c">125</text>
