<text x="78" y="816" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#3b2d1c">a circle is not a turn: 44 stations, every coordinate a whole number ≤ 3125</text>
<line x1="38" y1="836" x2="66" y2="836" stroke="#3b2d1c" stroke-width="3.4"/>
<text x="78" y="840" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#3b2d1c">at unit radius each station reduces: 1: 4, 5: 8, 25: 8, 125: 8, 625: 8, 3125: 8 stations by denominator</text>
