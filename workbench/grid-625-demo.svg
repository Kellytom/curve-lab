<text x="46" y="228" font-family="ui-monospace,Menlo,monospace" font-size="12.5" fill="#a8341f">3125</text>
<text x="150" y="228" font-family="ui-monospace,Menlo,monospace" font-size="12.5" fill="#a8341f">5^5</text>
