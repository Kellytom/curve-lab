<text x="34" y="38" font-family="Georgia,serif" font-size="18" fill="#3b2d1c">Fig. 5 · Fitting on a 5ⁿ grid · drawn on 3125</text>
<text x="34" y="62" font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="#8c6a21">a turn multiplies the denominator by its hypotenuse · a circle carries whole-number stations · no coordinate above 3125</text>
<text x="46" y="112" font-family="Georgia,serif" font-size="14" fill="#3b2d1c">the grid is a budget of steps</text>
<text x="46" y="140" font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="#8c6a21">grid</text>
<text x="150" y="140" font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="#8c6a21">5ⁿ</text>
