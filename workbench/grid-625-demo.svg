<text x="720" y="748" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#3b2d1c" text-anchor="middle">radius 3125 · 44 whole-number stations · largest coordinate 3125</text>
<rect x="0" y="760" width="1000" height="120" fill="#f7f1e3"/>
<line x1="38" y1="788" x2="66" y2="788" stroke="#a8341f" stroke-width="3.4"/>
<text x="78" y="792" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#3b2d1c">a turn divides by its hypotenuse: 5, 25, 125, … so a grid stops the chain after a few steps</text>
