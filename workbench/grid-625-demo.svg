<text x="470" y="228" font-family="ui-monospace,Menlo,monospace" font-size="12.5" fill="#a8341f">44</text>
<text x="46" y="258" font-family="ui-monospace,Menlo,monospace" font-size="12.5" fill="#3b2d1c">15625</text>
<text x="150" y="258" font-family="ui-monospace,Menlo,monospace" font-size="12.5" fill="#3b2d1c">5^6</text>
