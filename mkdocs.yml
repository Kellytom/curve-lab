site_name: curve-lab
site_description: Clothoid curves, pythagorean triples, and the ornament work built on them.
docs_dir: docs
exclude_docs: |
  README.md
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: material
  language: en
  palette:
    scheme: default
    primary: custom
    accent: custom
  font: false
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.smartsymbols

nav:
  - Start here: index.md
  - The tunnel (phone access): TUNNEL.md
  - Truth and state:
      - Verification: VERIFY.md
      - Fidelity budget: FIDELITY.md
  - The engine:
      - Architecture: ARCHITECTURE.md
      - Curve model: CURVE-MODEL.md
      - Integer PH curves: PH-INTEGER.md
      - Integer cubic Béziers: INTEGER-CUBIC.md
      - The G3 showcase: G3-showcase-docs.md
      - Pythagorean families: PYTHAGOREAN-FAMILIES.md
      - The spine layer: SPINE.md
      - Glossary: GLOSSARY.md
      - The web workbench: WEB-GUIDE.md
      - The input hub: HUB.md
  - Design:
      - Philosophy: PHILOSOPHY.md
      - Clearance: CLEARANCE.md
      - Junctions: JUNCTION.md
      - Primals: PRIMAL.md
      - Cap families: caps.md
      - The 3125 lattice: clothoid-grid-3125.md
  - Record:
      - Corpus and recovered plates: CORPUS.md
      - Handover: HANDOVER.md
      - Credits: CREDITS.md
      - Project history: PROJECT.md
      - Older todo: TODO.md
      - The web MVP: web.md
  - Reviews:
      - Architecture and print review: REVIEW.md
